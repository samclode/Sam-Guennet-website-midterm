<script>
  // Récupère tous les wrappers
  const wrappers = document.querySelectorAll('.mosaic-item-wrapper');

  wrappers.forEach(wrapper => {
    const preview = wrapper.querySelector('.preview');

    // Au clic / tap
    wrapper.addEventListener('click', e => {
      e.stopPropagation(); // Empêche le clic de remonter

      // 1) On ferme toutes les autres previews
      document.querySelectorAll('.preview').forEach(p => {
        if (p !== preview) p.style.display = 'none';
      });

      // 2) On togglle l'affichage de *celle-ci*
      preview.style.display = (preview.style.display === 'block') ? 'none' : 'block';
    });
  });

  // Clic en dehors → fermer toutes les previews
  document.addEventListener('click', () => {
    document.querySelectorAll('.preview').forEach(p => p.style.display = 'none');
  });
</script>
